# Audio modulation demo; run with --allow-audio while music is playing.
fps = 30
loop_seconds = 60
background = "#0d1216"

[audio]
enabled = true
sensitivity = 1.0

[[layers]]
name = "bass halo"
effects = [{ kind = "blur", intensity = 5.0 }]
[[layers.shapes]]
kind = "circle"
center = [0.5, 0.5]
size = [0.48, 0.48]
outline = 0.025
color = "#71c4e8"
opacity = 0.4
[layers.shapes.audio]
signal = "bass"
size = 0.25
opacity = 0.4
attack = 0.015
decay = 0.15

[[layers]]
name = "kick ring"
[[layers.shapes]]
kind = "circle"
center = [0.5, 0.5]
size = [0.48, 0.48]
outline = 0.01
color = "#526d81"
opacity = 0.7
[layers.shapes.audio]
signal = "kick_strength"
size = 0.25
color = "#e8faff"
opacity = 0.3
attack = 0.005
decay = 0.12

[[layers]]
name = "rotating polygon"
[[layers.effects]]
kind = "glitch"
intensity = 0.0
[layers.effects.audio]
signal = "onset_strength"
intensity = 0.18
attack = 0.005
decay = 0.10
[[layers.shapes]]
kind = "polygon"
sides = 3
size = [0.26, 0.26]
outline = 0.025
spin = 0.025
color = "#b7dce8"
[layers.shapes.audio]
signal = "onset"
spin = 0.15
position = [0.005, 0.005]
attack = 0.005
decay = 0.1

[[layers]]
name = "signal legend"
[[layers.shapes]]
kind = "text"
text = "AUDIO // REACTIVE\nBASS / KICK / ONSET"
origin = "top_left"
position = [30, 30]
position_unit = "px"
size = [230, 48]
size_unit = "px"
color = "#b7dce8"
