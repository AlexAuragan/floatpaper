fps = 30
loop_seconds = 300
seed = 7
background = "#050505"

# Optional global effects
effects = [
  { kind = "noise", intensity = 0.02, period = 12.0, pulse = 0.0 },
  { kind = "crt", intensity = 0.025, period = 20.0, pulse = 0.0 },
]

# =========================
# Background moving geometry
# =========================

[audio]
enabled = true
sensitivity = 1.0

[[layers]]
name = "background_shapes"
opacity = 1.0
background = "#00000000"
effects = [{ kind = "glitch", glitch_style = "fine", intensity = 0.35, period = 48.0, pulse = 0.6, audio = { signal = "kick_strength", intensity = 0.20, attack = 0.012, decay = 0.12 } }]


[[layers.shapes]]
kind = "triangle"
count = 16
center = [0.5, 0.5]
spread = [0.2, 0.2]
size = [0.045, 0.045]
size_jitter = 0.45
color = "#ffffff"
opacity = 1.0
motion = "drift"
radius = [0.03, 0.03]
period = 36.0
phase = 0.0
spin = 0.004
rotation = 0.0
rotation_jitter = 180.0
pulse = 0.0

