[package]
name = "floatpaper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Layered procedural Wayland wallpapers and deterministic video export"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
resvg = "0.43"
cosmic-text = "0.12"
toml = "0.8"
wgpu = "0.19.4"
pollster = "0.3"
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.13"
calloop-wayland-source = "0.3"
notify = "6.1"
ctrlc = "3.4"
libc = "0.2"
rustfft = "6.2"

[profile.release]
lto = "thin"
